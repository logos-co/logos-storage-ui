name: mix-config.json

# The Mix relays the UI ships (mix-config.json) are generated by hand with
# tools/gen-mix-config.sh. This job regenerates them from the live fleet data
# and fails when the committed file no longer matches, i.e. the fleet was
# redeployed and the file needs a refresh.

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: mix-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mix-config.json is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate from the live fleet data
        run: ./tools/gen-mix-config.sh

      - name: Compare with the committed file
        run: |
          if ! git diff --exit-code mix-config.json; then
            echo "::error file=mix-config.json::Outdated. Run ./tools/gen-mix-config.sh and commit the result."
            exit 1
          fi
