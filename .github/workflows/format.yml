name: Format

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ubuntu-24.04 ships clang-format 18: pinned so the version doesn't drift.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror
