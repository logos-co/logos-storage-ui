      #           if [ "$(uname)" = "Darwin" ]; then
      #             size=$(stat -f%z "$HOME/farewell-to-westphalia-foss-edition.pdf")
      #           else
      #             size=$(stat -c%s "$HOME/farewell-to-westphalia-foss-edition.pdf")
      #           fi
      #           if [ "$size" -ne 2276462 ]; then
      #             echo "size mismatch: $size"
      #             exit 1
      #           fi
      #           echo "download OK: $size bytes, still on disk after the delete"
