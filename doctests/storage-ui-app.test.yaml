      #         method: "clicked"
      #
      #       - name: "The manifest arrives in the list"
      #         action: wait_for
      #         texts: ["farewell-to-westphalia-foss-edition.pdf"]
      #         timeout: 60000
      #
      #       - name: "Download the file"
      #         # The manifest table sits below the fold in the headless
      #         # window, so a synthesized click would land outside it.
      #         action: call_method
      #         find_by: "objectName"
      #         find_value: "downloadButton"
      #         method: "clicked"
      #
      #       - name: "The download widget reports it complete"
      #         action: wait_for
      #         texts: ["Complete"]
      #         timeout: 60000
      #         screenshot: "storage-ui-downloaded.png"
      #         text: |
      #           The download icon turns green once a copy sits in the download
      #           folder. It stays clickable: the user can download it again.
      #
      #       - title: "The downloaded file exists on disk"
      #         text: |
      #           The file is in the user's home directory, which was the default download folder.
      #           The size is checked to make sure it is complete.
